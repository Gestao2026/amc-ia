name: Sincronizar com Upstream

on:
  schedule:
    - cron: '0 21 * * 5'   # toda sexta-feira as 21h UTC = 18h Brasilia
  workflow_dispatch:       # permite rodar manualmente pelo GitHub tambem

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Adicionar upstream e buscar atualizacoes
        run: |
          git remote add upstream https://github.com/DiegoAlmeidaDev/amc-ia.git
          git fetch upstream main

      - name: Criar branch sync-upstream e mesclar sem apagar arquivos do fork
        id: merge
        run: |
          set -e
          git checkout -B sync-upstream origin/main
          PRE_MERGE=$(git rev-parse HEAD)

          set +e
          git merge upstream/main --no-commit --no-ff
          MERGE_EXIT=$?
          set -e

          if [ $MERGE_EXIT -ne 0 ]; then
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Conflito real de conteudo entre fork e upstream. Abortando para revisao manual."
              git merge --abort
              exit 1
            fi
          fi

          if [ -f .git/MERGE_HEAD ]; then
            DELETADOS=$(git diff --name-only --diff-filter=D "$PRE_MERGE" -- || true)
            if [ -n "$DELETADOS" ]; then
              echo "Arquivos que o upstream apagou, mantidos no fork:"
              echo "$DELETADOS"
              printf '%s\n' "$DELETADOS" | while IFS= read -r arquivo; do
                git checkout "$PRE_MERGE" -- "$arquivo"
                git add "$arquivo"
              done
            fi
            git commit -m "chore: sincronizar com DiegoAlmeidaDev/amc-ia (aguardando aprovacao)"
            echo "houve_atualizacao=true" >> "$GITHUB_OUTPUT"
            echo "pre_merge=$PRE_MERGE" >> "$GITHUB_OUTPUT"
          else
            echo "Nada novo para sincronizar."
            echo "houve_atualizacao=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checar sintaxe e montar resumo detalhado das alteracoes
        id: checagem
        if: steps.merge.outputs.houve_atualizacao == 'true'
        run: |
          set -e
          PRE_MERGE="${{ steps.merge.outputs.pre_merge }}"

          echo "## Resumo das alteracoes" > resumo.md
          echo '```' >> resumo.md
          git diff --stat "$PRE_MERGE" HEAD >> resumo.md
          echo '```' >> resumo.md

          : > pendencias.md
          TEM_PENDENCIA=false
          for arquivo in $(git diff --name-only --diff-filter=ACMR "$PRE_MERGE" HEAD); do
            if [[ "$arquivo" == *.py ]]; then
              if ! python3 -m py_compile "$arquivo" 2>/tmp/erro.txt; then
                echo "- **$arquivo**: erro de sintaxe Python. $(tail -1 /tmp/erro.txt)" >> pendencias.md
                TEM_PENDENCIA=true
              fi
            elif [[ "$arquivo" == *.json ]]; then
              if ! python3 -c "import json; json.load(open('$arquivo', encoding='utf-8'))" 2>/tmp/erro.txt; then
                echo "- **$arquivo**: JSON invalido. $(tail -1 /tmp/erro.txt)" >> pendencias.md
                TEM_PENDENCIA=true
              fi
            fi
          done
          echo "tem_pendencia=$TEM_PENDENCIA" >> "$GITHUB_OUTPUT"

      - name: Enviar branch de sincronizacao (sem tocar na main)
        if: steps.merge.outputs.houve_atualizacao == 'true'
        run: git push origin sync-upstream --force

      - name: Criar ou atualizar Pull Request
        if: steps.merge.outputs.houve_atualizacao == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          {
            echo "Atualizacao automatica semanal a partir de DiegoAlmeidaDev/amc-ia. A main NAO foi alterada. Revise e aprove o merge."
            echo ""
            cat resumo.md
            if [ "${{ steps.checagem.outputs.tem_pendencia }}" = "true" ]; then
              echo ""
              echo "## Atencao. Pendencias tecnicas encontradas nos arquivos sincronizados"
              cat pendencias.md
              echo ""
              echo "Revise esses arquivos antes de aprovar o merge."
            fi
          } > corpo-pr.md

          PR_URL=$(gh pr list --head sync-upstream --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --title "Sincronizar com upstream" \
              --body-file corpo-pr.md \
              --base main \
              --head sync-upstream)
            echo "Pull Request criada: $PR_URL"
          else
            gh pr edit "$PR_URL" --body-file corpo-pr.md
            echo "Pull Request ja aberta, atualizada com o novo push e resumo: $PR_URL"
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
